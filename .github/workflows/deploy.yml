name: Deploy

# Order (docs/deployment.md): CI green -> migrate (backward compatible) -> deploy
# Worker -> verify. Runs on main only once the repository variable
# DEPLOY_ENABLED is "true" and these are set on the `production` environment:
#   secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PRODUCTION_DATABASE_URL
#            (Neon *direct* endpoint, used only for migrations)
#   vars:    PRODUCTION_BASE_URL
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy production
    # workflow_run fires for pull_request CI runs too (a fork branch named "main" would
    # match `branches`), so only a successful push to this repository's main deploys.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    # Add required reviewers to this GitHub Environment for manual approval.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked

      - name: Apply migrations (production)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: uv run alembic upgrade head

      - name: Deploy Worker (production)
        working-directory: server/cloudflare
        run: |
          npm ci
          uv sync --locked
          ./build.sh
          uv run pywrangler deploy

      - name: Verify deployment
        run: scripts/verify_deployment.sh "${{ vars.PRODUCTION_BASE_URL }}"
