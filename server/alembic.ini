[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Local development default. Set DATABASE_URL in the environment for another
# PostgreSQL instance; alembic/env.py gives it precedence over this value.
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/flutter_wars

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
