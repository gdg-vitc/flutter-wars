[project]
name = "gdg-flutter-workshop-server"
version = "0.1.0"
description = "Foundation and shared contracts for the GDG Flutter Workshop backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlmodel>=0.0.22,<0.1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "google-auth>=2.0,<3.0",
    "pyjwt>=2.0,<3.0",
    "requests>=2.0,<3.0",
    "alembic>=1.13,<2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
